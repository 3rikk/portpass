name: Apply BOT live-mode fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-botc-live.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rules.js exactly
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('rules.js')
          text = path.read_text()
          old = """      if (BOTC_TERRITORIES.includes(destination) && mode === 'live') {
        if (!restricted) add('conditional', p, 'Territory residence approval', TERRITORY_RESIDENCE[destination].conditions, TERRITORY_RESIDENCE[destination].source);
        continue;
      }
"""
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one BOT live shortcut, found {text.count(old)}')
          path.write_text(text.replace(old, '', 1))
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/fix-botc-live.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rules.js .github/workflows/fix-botc-live.yml
          git commit -m 'Handle BOT destinations like ordinary countries in live mode'
          git push
